name: Build Berry Manager Executables

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # A push moves one of two things: the program, or the catalog of addons the
  # store offers. They are built from different folders, and rebuilding both
  # executables because somebody added an addon to the store buys nothing, just
  # as a commit for a catalog that did not change buys nothing. So the push is
  # read first and the other two jobs do only what it actually touched.
  changes:
    runs-on: ubuntu-latest
    outputs:
      manager: ${{ steps.classify.outputs.manager }}
      store: ${{ steps.classify.outputs.store }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # The push is read as a range of commits, so the history has to be here.
        fetch-depth: 0

    - name: Work out what this push changed
      id: classify
      env:
        BEFORE: ${{ github.event.before }}
        AFTER: ${{ github.sha }}
        EVENT: ${{ github.event_name }}
      run: |
        manager=false
        store=false
        if [ "$EVENT" != push ] || ! git merge-base --is-ancestor "$BEFORE" "$AFTER" 2>/dev/null; then
          # A manual run asks for everything by name. So does a push whose
          # starting commit cannot be read - the first on a branch, or one that
          # rewrote history: guessing small there would skip a build that was
          # needed, and nobody would notice.
          manager=true
          store=true
          echo "No commit range to read: everything counts as changed."
        else
          files=$(git -c core.quotePath=false diff --name-only "$BEFORE" "$AFTER")
          if [ -z "$files" ]; then
            echo "This push carries no file changes."
          else
            echo "$files"
            while IFS= read -r file; do
              case "$file" in
                # The catalog is made of the store's addons, their pictures,
                # their tests, and the tool that writes index.json from them.
                "addon.store/"*) store=true ;;
                # The theme store is cut from the same cloth: its folder of
                # .theme files and the tool that writes its index.json.
                "themes.store/"*) store=true ;;
                # Every build-time tool is the one file at the top of the
                # repository: it writes both catalogs and it holds every gate
                # below, so a change to it moves a catalog and has to be
                # proved by a build.
                "buildtools.py") store=true ; manager=true ;;
                # The program is made of everything else under it - the app,
                # the addons that ship inside it, its assets, its
                # requirements - and of this workflow, so a change to the
                # recipe is proved by the build it just described. Anything
                # outside these is in neither list: a push of the web
                # dashboard, or of a README, builds nothing at all.
                "src/berry_manager/"*|.github/workflows/build.yml) manager=true ;;
              esac
            done <<< "$files"
          fi
        fi
        echo "manager=$manager" >> "$GITHUB_OUTPUT"
        echo "store=$store" >> "$GITHUB_OUTPUT"
        echo "rebuild the program: $manager"
        echo "rewrite the catalog: $store"

  catalog:
    needs: changes
    if: needs.changes.outputs.store == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Regenerate the store catalogs
      run: |
        # index.json is the catalog the store reads off GitHub at runtime, so it
        # has to be committed, not just built. Rebuild it from the addons sitting
        # in addon.store (name, version, author, assets, new/updated marks) and
        # push it back only when it actually moved. [skip ci] keeps this commit
        # from re-triggering the very workflow that makes it.
        python buildtools.py gen-addon-store-index
        git config user.name "github-actions[bot]"
        git config user.email "4198681+github-actions[bot]@users.noreply.github.com"
        wrote=false
        if [ -n "$(git status --porcelain -- addon.store/index.json)" ]; then
          git add addon.store/index.json
          git commit -m "Update addon store catalog [skip ci]"
          wrote=true
        else
          echo "addon.store/index.json was already up to date"
        fi
        # The theme store's catalog is made the same way, from the .theme files
        # in themes.store; both push back together, or not at all.
        python buildtools.py gen-theme-store-index
        if [ -n "$(git status --porcelain -- themes.store/index.json)" ]; then
          git add themes.store/index.json
          git commit -m "Update theme store catalog [skip ci]"
          wrote=true
        else
          echo "themes.store/index.json was already up to date"
        fi
        if [ "$wrote" = true ]; then
          git push
        fi

  build:
    # Only what the push changed decides this job, so it waits for nothing but
    # the reading of it. Depending on `catalog` looks natural and is a trap:
    # GitHub counts a skipped job as not successful, so a push that moved the
    # program while the catalog had nothing to rewrite would have taken its
    # build down with it. No waiting is needed either: the program does not
    # carry index.json - the store fetches that off GitHub when it runs - so
    # the two halves share nothing but the checkout, and neither can disturb
    # what the other commits or uploads.
    needs: changes
    if: needs.changes.outputs.manager == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libgl1 libegl1 libnss3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0

    - name: Install Python dependencies
      working-directory: "src/berry_manager"
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller Pillow
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Check for names that do not exist
      run: |
        # A Qt program dies on an exception raised inside a slot rather than
        # printing it and carrying on, so a name nothing binds is a crash for
        # whoever opens that dialog - not a warning somewhere in a log. One
        # shipped exactly that way, over an f-string written for a .format() that
        # never reached it. That class is visible without running anything, so it
        # is looked for here, before either program is built. The tool keeps only
        # the answers that mean a crash; see buildtools.py check-names.
        python -m pip install --quiet pyflakes
        python buildtools.py check-names

    - name: Check the addon API says what it does
      run: |
        # The Addon Dev tab's Docs pane makes its reference out of the docstrings
        # in addon_api, and a call without one is printed as saying nothing rather
        # than given invented words. Honest, and no use to whoever is reading it -
        # and the pane is only opened by someone who already has a question, so the
        # gap would sit there through build after build. The tool walks the same
        # namespaces the pane does; see buildtools.py check-api-docs.
        python buildtools.py check-api-docs

    - name: Check the guides link to pages that exist
      run: |
        # The same pane's guides are markdown stitched to the reference by links -
        # guide:config to another page, api:tabs.add_tab to a call. A link whose
        # target was renamed or never added does not raise: the words print and
        # the click does nothing, noticed only by whoever tries it. The tool also
        # parses the templates New addon... writes, since a mistake there is a
        # syntax error an author meets after the app has handed them the file.
        # See buildtools.py check-guide-links.
        python buildtools.py check-guide-links

    - name: Check what a tab says about its addon
      run: |
        # An addon's Settings row and the Settings Connection list both say whose
        # connection the addon rides, out of one decision over its transports, its
        # being shipped with the program and its manifest's declaration. A wrong
        # answer crashes nothing: it just tells the user an addon waits for a
        # connection it never opens, or offers a switch the app would refuse - and
        # the published catalog is read by the same rules, so a row and the entry
        # it was built from cannot drift apart. See
        # buildtools.py check-connection-saying.
        python buildtools.py check-connection-saying

    - name: Check every picture file is where the rule says it is
      run: |
        # Every addon wears a mark of its own, under one name: its id and then
        # icon.png - in assets/ for an addon that ships inside the program, in
        # addon.store/assets/<id>/ for one the store publishes, and the program's
        # own marks (the tab default, the terminal, the Settings cog, the tile an
        # addon with no picture is shown with) in assets/ as well. A missing file
        # stops nothing, which is the problem: the tab quietly draws the fallback
        # in its source and the store's card shows a default tile, so a picture
        # that was never made is only noticed by whoever looks for it. The same two
        # tools write these pictures out of the drawings in the sources, so what is
        # expected and what is shipped come from one place; see
        # buildtools.py make-addon-icons and buildtools.py make-store-icons.
        python buildtools.py make-addon-icons --check
        python buildtools.py make-store-icons --check

    - name: Check the dashboard's icons are the app's
      run: |
        # The web dashboard wears the program's own mark as its favicon set and
        # its home-screen tiles, drawn out of assets/icon.png by one tool. A
        # logo that changed without those running would leave the browser
        # showing an icon nothing else in the app shows, and no test would say
        # so - the files are pictures, not code. See buildtools.py make-web-icons.
        python buildtools.py make-web-icons --check

    - name: Check the shipped pictures are packed
      run: |
        # Every picture the program carries, the store's cards wear and the
        # dashboard links to is written with its bytes deflated as hard as they
        # go. The three picture tools do that themselves now, but two of the
        # shipped files are artwork somebody put in the tree that no tool owns,
        # and anything written before that carries whatever compression one
        # machine's Qt happened to reach for. Nothing is resized, re-filtered or
        # re-coloured here - the question is only whether the bytes already in
        # the file can be packed again - so a picture cannot change shape over
        # this step, and all that is noticed is weight. See buildtools.py pack-pngs.
        python buildtools.py pack-pngs --check

    - name: Check the theme store catalog is up to date
      run: |
        # The Theme Store reads themes.store/index.json off GitHub, and the
        # program bundles the same file, so a committed index that drifted from
        # the .theme files beside it would be what every install sees. The
        # catalog job rewrites it when the folder moves; this proves the copy in
        # the tree is that copy. See buildtools.py gen-theme-store-index.
        python buildtools.py gen-theme-store-index --check

    - name: Run the addon test scripts
      shell: pwsh
      working-directory: "src/berry_manager"
      env:
        # A Windows runner's console speaks cp1252 and the tests print the
        # marks their tabs wear (● ○ ✓), which would abort the print itself.
        # With this, every child python writes UTF-8 whatever the console is.
        PYTHONIOENCODING: utf-8
        # One test asks the real repository: the Berry web dashboard's GitHub
        # route is the half that cannot be checked from the source alone.
        # Anonymous requests are capped at sixty an hour for a machine, and a
        # runner spends that with every job on it - the catalog job of this very
        # push among them - so the ask is made with this run's own token. Without
        # one the test says so and skips that half rather than failing on a
        # refusal.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        # Every addon's test lives beside it: the shipped addons in addons/_tests,
        # the store's in addon.store/_tests, each as test_<id>.py. Run them here,
        # before anything is packaged: they drive the addon against a stubbed app
        # offscreen, so no device and no window are involved. A failing test fails
        # the build. The tests themselves never reach the executable - the staging
        # step below skips _folders. One command does the whole set now: the
        # runner in buildtools.py finds every test_*.py in the two folders and
        # runs the suites side by side - they share nothing but the disk - then
        # prints their blocks in folder order, so this log reads as the serial
        # one did. A new addon's test is found without anything being told.
        # Say what machine these answers came off, and with what. When one of
        # these tests passes on a runner and fails on the other, it is either Qt
        # laying out or painting to that platform's font, or a record inside the
        # test that names one system only - and these three lines are what tells
        # the two apart. The same Qt and Python on both sides means the
        # difference is in the test's own data rather than in a measurement, and
        # a test that has to measure something is written against what the addon
        # promised instead of what one machine made of it.
        python -c "import platform, sys; print(sys.platform, platform.release(), platform.machine(), sys.version.split()[0])"
        python -c "from PyQt6.QtCore import QT_VERSION_STR, PYQT_VERSION_STR; print('Qt', QT_VERSION_STR, 'PyQt', PYQT_VERSION_STR)"
        # ... and how much room its fonts take: the addon tests lay tabs out
        # offscreen, so a machine with no font to draw has measured column
        # widths and row heights of its own, and that is the one thing a text
        # width here shows up before the checks that lean on it do.
        python -c "import os; os.environ['QT_QPA_PLATFORM']='offscreen'; from PyQt6.QtWidgets import QApplication; from PyQt6.QtGui import QFont, QFontMetrics; app = QApplication([]); print('text width of Hello in Sans 11:', QFontMetrics(QFont('Sans', 11)).horizontalAdvance('Hello'))"
        python ../../buildtools.py test
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Stage the addons that ship inside the program
      shell: pwsh
      working-directory: "src/berry_manager"
      run: |
        # Every addon in addons/ is packed into the executable under the name the
        # app reads as its shipped addons. Such an addon can be switched on and
        # off in Settings and keeps its own config file beside the exe, but its
        # source belongs to the build: it is shown as it is and never edited.
        # Only what the app's scanner recognises counts, in every shape it takes:
        # a loose .py, a loose compiled program (.exe or .bin) with its own
        # <name>.json manifest beside it, and a folder holding addon.py, main.py
        # or a compiled addon.exe / addon.bin / <folder>.exe. The folders the
        # runtime and the Addon Dev tab write while they work (_tests, _data,
        # _build, configs, __pycache__) are left out.
        $stage = "_addon_bundle"
        if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
        New-Item -ItemType Directory -Force -Path $stage | Out-Null
        Get-ChildItem -Path addons -Filter *.py -File |
          Copy-Item -Destination $stage -Force
        foreach ($program in (Get-ChildItem -Path addons -File |
                    Where-Object { $_.Extension -in ".exe", ".bin" })) {
          Copy-Item -Path $program.FullName -Destination $stage -Force
          $manifest = Join-Path "addons" ($program.BaseName + ".json")
          if (Test-Path $manifest -PathType Leaf) {
            Copy-Item -Path $manifest -Destination $stage -Force
          }
        }
        Get-ChildItem -Path addons -Directory |
          Where-Object { $_.Name -notlike ".*" -and $_.Name -notlike "_*" -and $_.Name -ne "configs" } |
          Where-Object {
            (Test-Path (Join-Path $_.FullName "addon.py") -PathType Leaf) -or
            (Test-Path (Join-Path $_.FullName "main.py") -PathType Leaf) -or
            (Test-Path (Join-Path $_.FullName "addon.exe") -PathType Leaf) -or
            (Test-Path (Join-Path $_.FullName "addon.bin") -PathType Leaf) -or
            (Test-Path (Join-Path $_.FullName ($_.Name + ".exe")) -PathType Leaf)
          } |
          ForEach-Object {
            $into = Join-Path $stage $_.Name
            New-Item -ItemType Directory -Force -Path $into | Out-Null
            Copy-Item -Path (Join-Path $_.FullName "*") -Destination $into -Recurse -Force
          }
        # Nothing test-shaped or left over from a local run travels with the
        # build, wherever it hides: a folder addon's own tests, or bytecode
        # written by a local ``precompile-addons``, are stripped from the staged
        # copy - the next step makes fresh bytecode for these exact sources, and
        # an old file sitting beside a new one would simply be refused.
        Get-ChildItem -Path $stage -Recurse -Directory |
          Where-Object { $_.Name -in "__pycache__", "tests", "_tests" } |
          ForEach-Object { Remove-Item -Recurse -Force $_.FullName }
        Get-ChildItem -Path $stage -Recurse -File |
          Where-Object { $_.Extension -eq ".pyc" } |
          ForEach-Object { Remove-Item -Force $_.FullName }
        if (-not (Get-ChildItem -Path $stage -Recurse -File)) {
          # PyInstaller wants every --add-data source to exist and hold something.
          Set-Content -Path (Join-Path $stage "README.txt") -Value "no addon ships inside this build"
        }
        Write-Output "addons packed into the program:"
        Get-ChildItem -Path $stage -Recurse -Name

    - name: Precompile the addons packed inside the program
      shell: pwsh
      working-directory: "src/berry_manager"
      run: |
        # The addons a build packs sit in a folder that is unpacked again on
        # every start, so nothing the interpreter caches carries over from one
        # run to the next: each start reads every shipped addon's text and
        # parses it, which is a few hundred milliseconds before the window is
        # drawn. This writes a <name>.pyc beside each staged source instead, so
        # the program unmarshals bytecode in milliseconds and keeps the .py in
        # the build purely for whoever wants to read it.
        # What is written carries a checked hash of the text it came from, and
        # addon_common.bytecode_ready only accepts the pair while that hash
        # still matches: an addon dropped into the folder beside the exe, or one
        # the Dev tab has just edited, is read from its own source as it always
        # was, and a bytecode file built by another Python is passed by
        # altogether. The second call asks the app's own question of what was
        # just written - sidecars the running program would ignore mean a build
        # that quietly went back to parsing, which is noticed here rather than
        # in a boot nobody measures. See buildtools.py precompile-addons.
        $bundle = (Resolve-Path _addon_bundle).Path
        python ../../buildtools.py precompile-addons $bundle
        if ($LASTEXITCODE -ne 0) { Write-Output "FAILED to compile the staged addons"; exit 1 }
        python ../../buildtools.py precompile-addons --check $bundle
        if ($LASTEXITCODE -ne 0) { Write-Output "FAILED: the packed bytecode is not what the app would read"; exit 1 }

    - name: Stage the modules an addon imports
      shell: pwsh
      working-directory: "src/berry_manager"
      run: |
        # Compiling and testing an addon run in a Python of their own, outside
        # the archive, and read addon_client and addon_common off disk: a built
        # program that kept them only inside itself could never build an addon
        # that talks to it. So a plain copy travels with the build, and the
        # program points at it as core.const.HARNESS_DIR. The app's other
        # modules go along for the same reason: a published addon test imports
        # addon_api to build real widgets, and without it the test says nothing
        # either way - the store notes that and compiles anyway.
        $harness = "_addon_harness"
        if (Test-Path $harness) { Remove-Item -Recurse -Force $harness }
        New-Item -ItemType Directory -Force -Path $harness | Out-Null
        foreach ($name in @("addon_common.py", "addon_client.py")) {
          if (-not (Test-Path $name -PathType Leaf)) {
            Write-Error "$name is not there to pack"; exit 1
          }
        }
        Copy-Item -Path *.py -Destination $harness -Force
        # ... and the package the loose files now belong to. A copy of the root's
        # .py files alone would leave every ``core.*`` import of the harness out
        # of the archive, and a published addon test that reads the window's own
        # modules would fail on a folder that was never packed.
        Copy-Item -Recurse core -Destination $harness -Force
        Write-Output "modules packed for a build and a test to read:"
        Get-ChildItem -Path $harness -Recurse -Name

    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      working-directory: "src/berry_manager"
      shell: cmd
      run: >
        pyinstaller --noconfirm --onedir --windowed --icon="assets\icon.png"
        --add-data="assets;assets" --add-data="config.example.json;."
        --add-data="_addon_bundle;addons" --add-data="_addon_harness;harness"
        --hidden-import=PyQt6.QtWebEngineWidgets --hidden-import=PyQt6.QtWebEngineCore
        --hidden-import=PyQt6.QtMultimedia
        berry_manager.py

    - name: Build with PyInstaller (Linux)
      if: runner.os == 'Linux'
      working-directory: "src/berry_manager"
      run: >
        pyinstaller --noconfirm --onedir --windowed --icon="assets/icon.png"
        --add-data="assets:assets" --add-data="config.example.json:."
        --add-data="_addon_bundle:addons" --add-data="_addon_harness:harness"
        --hidden-import=PyQt6.QtWebEngineWidgets --hidden-import=PyQt6.QtWebEngineCore
        --hidden-import=PyQt6.QtMultimedia
        --hidden-import=secretstorage --hidden-import=jeepney
        berry_manager.py

    - name: Ship the drop-in addons folder
      shell: pwsh
      working-directory: "src/berry_manager"
      run: |
        # The addons that came with the program are inside the executable, so the
        # folder beside it starts empty and is the user's own: what they drop
        # there is what they can read, change and delete. A --onedir build is a
        # folder (the program file and its _internal), so this note is written
        # inside that folder, beside the program - the shape the release packs
        # and the setup unpacks. The app creates the folder anyway, so a note is
        # all that is shipped with it.
        New-Item -ItemType Directory -Force -Path dist/berry_manager/addons | Out-Null
        $note = @(
          "Drop an addon in this folder: a .py file, a folder holding addon.py,",
          "or a program (.exe) with a .json manifest of the same name. The app",
          "reads the folder when it starts and lists what it finds on the",
          "Addon manager page of the addon store.",
          "",
          "An addon that came with the program is packed inside the executable",
          "and is switched on and off on its own page in Settings instead. A",
          "file dropped here with the same name takes the place of that shipped",
          "addon. Each addon keeps",
          "its own settings in addons/_data/<name>/config.json, and its own tab",
          "picture in addons/assets/<name>/<name>icon.png - or in assets/ beside",
          "the program, under that same name."
        ) -join [Environment]::NewLine
        Set-Content -Path dist/berry_manager/addons/README.txt -Value $note -Encoding utf8

    - name: Build the setup program (Windows)
      if: runner.os == 'Windows'
      working-directory: "src/berry_manager"
      shell: cmd
      run: >
        pyinstaller --noconfirm --onefile --windowed --name="berry_manager-setup"
        --icon="assets\icon.png" --add-data="assets;assets"
        installer.py

    - name: Build the setup program (Linux)
      if: runner.os == 'Linux'
      working-directory: "src/berry_manager"
      run: >
        pyinstaller --noconfirm --onefile --windowed --name="berry_manager-setup"
        --icon="assets/icon.png" --add-data="assets:assets"
        installer.py

    - name: Upload the program build
      uses: actions/upload-artifact@v4
      with:
        name: berry_manager-${{ runner.os }}
        # A --onedir build is the whole dist/berry_manager folder: the program
        # file, its _internal, and the drop-in addons the step above wrote. The
        # release packs this folder so those three land at the top of the zip,
        # which is what the setup reads back.
        path: src/berry_manager/dist/berry_manager/
        retention-days: 7

    - name: Upload the setup program
      uses: actions/upload-artifact@v4
      with:
        # A single file beside the build folder, so its artifact name is not
        # picked up by the release's ``berry_manager-*`` download (a folder of
        # that name would hide the program build); it is published as itself.
        # The onefile output is ``berry_manager-setup`` on Linux and
        # ``berry_manager-setup.exe`` on Windows, so only the extension moves.
        # Put the non-empty value in the ``&&`` branch: GitHub reads ``''`` as
        # falsy, so writing ``Linux && '' || '.exe'`` short-circuits to ``.exe``
        # on *both* systems and this step then looks for a ``.exe`` that Linux
        # never built. ``if-no-files-found: error`` keeps that kind of mismatch
        # failing here, at the step that made it, rather than surfacing as an
        # empty artifact two jobs later in the release's ``find``.
        name: berry-setup-${{ runner.os }}
        path: src/berry_manager/dist/berry_manager-setup${{ runner.os == 'Windows' && '.exe' || '' }}
        if-no-files-found: error
        retention-days: 7

  # A build that passed its tests and packaged its two programs *is* a release:
  # the tag the Manager update addon reads and the files it downloads are made
  # here out of what this very run built, so a published version can never be a
  # commit nobody packaged. Nothing is published for a build that did not
  # happen (this job waits on all of the matrix), and a re-run at the same
  # version replaces that release's files instead of leaving a broken one up.
  release:
    needs: build
    # Only what reached main is published. Without this a manual run started on
    # a side branch would put a version up under a tag nobody merged, and the
    # update addon would offer it to every copy of the program.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Collect the program builds
      uses: actions/download-artifact@v4
      with:
        # One folder per artifact: built/berry_manager-Windows and
        # built/berry_manager-Linux, each holding the whole --onedir build (the
        # program, its _internal, and the drop-in addons) - the shape the
        # workflow staged. berry-setup-* is deliberately not matched here: the
        # setup is a loose file, gathered by the step after this one.
        pattern: berry_manager-*
        path: built
        merge-multiple: false

    - name: Collect the setup programs
      uses: actions/download-artifact@v4
      with:
        # built/../setup-Windows and setup-Linux, each holding the single
        # berry_manager-setup program this run built for that system.
        pattern: berry-setup-*
        path: setup
        merge-multiple: false

    - name: Pack one archive per system
      id: pack
      run: |
        # The version is read from the one place it lives, so a release is made
        # by editing core.const.APP_VERSION and pushing: no tag to type,
        # no button to press. It is the program's byte-packed hex (three 0x bytes
        # joined with dots, e.g. 0x3.0x1.0x0), read here as it stands - the sed
        # takes the quoted text, not digits - so the tag is ``berry`` + that hex.
        # Each archive is named for the system it holds - the update addon tells
        # the two apart by exactly that word.
        version=$(sed -n 's/^APP_VERSION *= *"\([^"]*\)".*/\1/p' \
                  'src/berry_manager/core/const.py')
        if [ -z "$version" ]; then
          echo "APP_VERSION could not be read from core/const.py"; exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=berry$version" >> "$GITHUB_OUTPUT"
        echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        mkdir -p release
        for pair in Windows:windows Linux:linux; do
          folder="built/berry_manager-${pair%%:*}"
          if [ ! -d "$folder" ]; then
            echo "there is no $folder to publish from"; exit 1
          fi
          # zipped from inside its own folder, so the program and addons/ land
          # at the top of the archive; -X keeps the archive free of the
          # packer's own junk. The modes an artifact comes back with are not the
          # ones it was built with - upload-artifact does not carry the
          # executable bit - so the Linux program is made runnable here: someone
          # installing from the release page runs ./berry_manager and nothing
          # else puts that bit back for them.
          if [ -f "$folder/berry_manager" ]; then
            chmod 755 "$folder/berry_manager"
          fi
          ( cd "$folder" && zip -q -r -X "$GITHUB_WORKSPACE/release/berry_manager-${pair##*:}.zip" . )
        done
        # The setup is a real program of its own, built for each system, so it
        # rides on the release as that system's file: berry_manager-setup-windows
        # (an .exe) and berry_manager-setup-linux. It is what installs the folders
        # above, and it looks nothing like them - a lone file, not a tree.
        for pair in Windows:windows Linux:linux; do
          sdir="setup/berry-setup-${pair%%:*}"
          found=$(find "$sdir" -maxdepth 1 -type f -name 'berry_manager-setup*' | head -n1)
          if [ -z "$found" ]; then
            echo "there is no setup program in $sdir to publish"; exit 1
          fi
          dest="release/berry_manager-setup-${pair##*:}"
          case "$found" in
            *.exe) dest="$dest.exe" ;;
          esac
          cp "$found" "$dest"
          case "$found" in
            *.exe) : ;;
            *) chmod 755 "$dest" ;;
          esac
        done
        echo "archives to publish:"; ls -l release

    - name: Publish the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.pack.outputs.tag }}
        VERSION: ${{ steps.pack.outputs.version }}
        COMMIT: ${{ steps.pack.outputs.commit }}
        SHA: ${{ github.sha }}
      run: |
        # A tag carries source and nothing else, so the files have to ride on a
        # release under that tag - which is what the app downloads. Three
        # states: this version is being published, its tag was made by hand and
        # never got a release, or a release is already up and its files are
        # being replaced.
        cat > note.md <<EOF
        Built by the Actions workflow from commit \`$COMMIT\`.

        - **berry_manager-setup-windows** / **berry_manager-setup-linux** - the
          setup program. Run it and it installs the app for you: it either
          brings down the build below and unpacks it where you choose, or
          compiles one on the machine with PyInstaller. It wears the app's own
          boot card, and both doors take their data from this GitHub repository
          (the source can be set, but it defaults to the one it shipped with).
        - **berry_manager-windows.zip** - the program folder (the program file,
          its \`_internal\`, and the empty drop-in \`addons\`), for Windows.
        - **berry_manager-linux.zip** - the same for Linux.

        The two archives are what the setup installs and what an update swaps;
        keep \`addons\` beside the program. An addon dropped in that folder is
        read when the app starts, and each addon keeps its own settings under
        \`addons/_data\`. The in-app **Manager update** tab reads this tag as
        version \`$VERSION\` (the program's byte-packed hex), takes the archive
        whose name says its own system, and lays the whole folder down in place
        of the one you are running.
        EOF
        title="Berry Manager $VERSION"
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "release $TAG is already published: its note and files are replaced"
          # The tag is left where it was made - moving a published tag would
          # pull the source out from under anyone who already fetched it - so
          # this just says when the build came from a later commit than the tag.
          # The commits endpoint is asked, not the ref itself: a hand-made tag
          # is an annotated object, and its ref would name the tag rather than
          # the commit it points at, which would read as a difference always.
          at=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" \
               --jq '.sha' 2>/dev/null || echo unknown)
          if [ "$at" != "unknown" ] && [ "$at" != "$SHA" ]; then
            echo "note: the tag still points at ${at:0:8}, not at this run's $SHA"
            echo "the release's files are this build; its source archive is not"
          fi
          gh release edit "$TAG" --title "$title" --notes-file note.md
        elif [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
          echo "tag $TAG exists with no release: publishing one at it"
          gh release create "$TAG" --title "$title" --notes-file note.md
        else
          gh release create "$TAG" --target "$SHA" --title "$title" \
            --notes-file note.md
        fi
        # --clobber: an asset of this name from an earlier run is replaced, so
        # a re-run at the same version cannot leave two files to choose from.
        gh release upload "$TAG" release/* --clobber
        gh release view "$TAG" --json tagName,assets \
          --jq '"published \(.tagName) with: \([.assets[].name] | join(", "))"'